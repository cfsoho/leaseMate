name: Deploy leaseMate

on:
  push:
    branches: [ main ]  # Triggers deployment when you push to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push images to GitHub Packages

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # 👈 This pulls your Git repo onto the Ubuntu Runner

    # 1. Log into GitHub Container Registry
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 2. Build and Push Backend Image
    - name: Build and push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ghcr.io/cfsoho/leasemate-backend:latest

    # 3. Build and Push Frontend Image
    - name: Build and push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ghcr.io/cfsoho/leasemate-frontend:latest

    # 4. Copy the config files from the Ubuntu Runner over to AWS
    - name: Copy Compose and Nginx configs to AWS via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "docker-compose.yml,nginx/leasemate.conf" # 👈 Files pulled from Git
        target: "~/leasemate-deploy"                     # 👈 Destination on AWS

    # 5. SSH into AWS to apply the configuration and start containers
    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Move into the folder where SCP dropped the files
          cd ~/leasemate-deploy
          
          # Move the Nginx file to the system-wide Nginx configuration directory
          sudo cp ./nginx/leasemate.conf /etc/nginx/conf.d/leasemate.conf
          
          # Test and reload Nginx
          sudo nginx -t && sudo systemctl reload nginx

          # Authenticate Docker on AWS and pull the new images from GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
          sudo docker compose pull
          sudo docker compose up -d