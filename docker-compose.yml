version: "3.9"

services:
  backend:
    build: ./backend
    container_name: leasemate-backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: leasemate-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
  db:
    image: postgres:15
    container_name: leasemate-db
    restart: always
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
