version: "3.9"

services:
  backend:
    build: ./backend
    container_name: leasemate-backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy   # 👈 ensures DB is ready

    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: leasemate-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
  db:
    image: postgres:15
    container_name: leasemate-db
    restart: always
    env_file: .env
    ports:
      - "9854:5432"   # ✅ external 9854 (host) → internal 5432 (container)

    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leasemate -d leasemate_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
